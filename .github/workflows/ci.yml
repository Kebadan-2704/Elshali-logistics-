name: Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Lint, Typecheck, Build & QA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify zero ESLint errors & warnings
        run: npm run lint

      - name: Verify TypeScript static compilation
        run: npx tsc --noEmit

      - name: Build Next.js production bundle
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.elshali.com
          STRICT_LEAD_CONFIG: 'false'

      - name: Run Playwright lead capture resilience tests
        run: npx playwright test qa/lead-capture.spec.ts --project=chromium

      - name: Run Playwright comprehensive QA audit suite
        run: npx playwright test qa/full-audit.spec.ts --project=chromium

